<body><header class="lj-header"><a class="lj-brand" href="index.html">LÚA TRAVEL</a><nav class="lj-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="destinations.html">Destinations</a><a href="tours.html">Our tours</a><a href="about.html">About Lúa</a><a href="contact.html">Plan your trip</a></nav></header>
<main id="journal-content"></main>
<footer class="lj-footer"><a href="index.html">LÚA TRAVEL &amp; TOURS</a> · Thoughtfully made journeys in Vietnam</footer>
<script>
const stories=[{"slug":"sense-of-place","tag":"A SENSE OF PLACE","title":"Moments that stay","subtitle":"The little details of Hội An that make a journey memorable.","image":"hero%20lua%20m%E1%BB%9Bi%20nh%E1%BA%A5t.jpg","alt":"Woman in traditional áo dài beside a bicycle in Hội An","intro":"Some places reveal themselves slowly. In Hội An, it might be a quiet street in the early morning, the sound of a bicycle passing an old yellow wall, or the scent of coffee from a nearby doorway.","sections":[["A slower way to see Hội An","Away from the busiest hours, Hội An feels wonderfully personal. Wander through its lanes without a checklist. Notice the faded paint, the tiled rooftops, and the rhythms of everyday life. The atmosphere is often the most memorable part of the visit."],["Make room for the unexpected","A beautiful journey needs a little freedom. Time for a second coffee, a conversation, or simply a moment to sit and watch the town wake up. These pauses give a destination its meaning."],["Thoughtfully shaped by local people","At Lúa, we believe thoughtful planning should leave room for discovery. Our private journeys pair local insight with an unhurried pace, so the experience feels like your own."]]},{"slug":"local-connections","tag":"LOCAL CONNECTIONS","title":"Stories worth sharing","subtitle":"Why meeting local people is at the heart of meaningful travel.","image":"c4790bc6af2211bea9a9f19bb540dba5%20(2).jpg","alt":"Bougainvillea framing a yellow heritage wall in Hội An","intro":"The places we remember most are often tied to the people we meet. A shared meal, a story about a family craft, or a simple welcome can change how we understand a destination.","sections":[["Beyond the familiar sights","Vietnam’s landscapes and architecture are extraordinary, but its everyday encounters bring another dimension to travel. Sitting down with local hosts, learning about traditional skills, and exploring neighbourhoods at a human pace can make an itinerary feel alive."],["Connection over a checklist","Meaningful experiences do not need to be elaborate. They need curiosity, respect, and enough time to listen. An exchange that begins with a small question can become the story you tell long after returning home."],["Travelling with care","We favour experiences that make space for genuine interaction. Our local perspective helps us connect each journey with places and people in a thoughtful, considerate way."]]},{"slug":"unhurried-journeys","tag":"UNHURRIED JOURNEYS","title":"Vietnam, your way","subtitle":"The quiet pleasure of travelling at a pace that feels right for you.","image":"ninh%20binh.jpg","alt":"Limestone karsts and tranquil river landscape in Ninh Bình","intro":"A journey does not become richer by filling every hour. Sometimes the best decision is to leave the afternoon open, linger beside the water, or take the scenic route just because it feels right.","sections":[["Choose what matters most","A couple seeking a peaceful retreat, a family with different interests, and friends travelling together will each experience Vietnam differently. A private journey begins by listening to the people who are taking it."],["The beauty of breathing room","From northern mountain landscapes to the heritage towns of central Vietnam, there is so much worth discovering. Thoughtful pacing allows the details to emerge naturally, without rushing from one highlight to another."],["Your journey, thoughtfully made","Lúa designs around your interests, travel style, and preferred pace. Local knowledge brings everything together, while the itinerary remains flexible enough for the moments you did not plan."]]}];
const slug=new URLSearchParams(location.search).get('story');
const chosen=stories.find(x=>x.slug===slug);
const card=s=>`<a class="lj-card" href="journal.html?story=${s.slug}"><img src="${s.image}" alt="${s.alt}" loading="lazy"><span class="lj-eyebrow">${s.tag}</span><h2>${s.title}</h2><p>${s.subtitle}</p><span class="lj-link">Discover the story ↗</span></a>`;
const root=document.getElementById('journal-content');
if(chosen){
 document.title=chosen.title+' | The Lúa Journal';
 root.innerHTML=`<article class="lj-article lj-shell"><a class="lj-back" href="journal.html">← All stories</a><div class="lj-article-head"><span class="lj-eyebrow">${chosen.tag}</span><h1>${chosen.title}</h1><p>${chosen.subtitle}</p></div><figure class="lj-article-figure"><img src="${chosen.image}" alt="${chosen.alt}"></figure><div class="lj-copy"><p class="lj-intro">${chosen.intro}</p>${chosen.sections.map(x=>`<section><h2>${x[0]}</h2><p>${x[1]}</p></section>`).join('')}<a class="lj-link" href="contact.html">Plan a journey of your own ↗</a></div><div class="lj-related"><h2>Explore more stories</h2><div class="lj-grid">${stories.filter(x=>x.slug!==chosen.slug).map(card).join('')}</div></div></article>`;
}else{
 root.innerHTML=`<div class="lj-shell"><div class="lj-index-head"><span class="lj-eyebrow">THE LÚA JOURNAL</span><h1>Stories from Vietnam.</h1><p>Notes on the places, people and unhurried moments that make a journey stay with you.</p></div><div class="lj-grid">${stories.map(card).join('')}</div></div>`;
}
</script></body></html>
