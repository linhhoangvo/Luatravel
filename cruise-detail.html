const selected=new URLSearchParams(window.location.search).get('cruise');
const cruise=cruises.find(c=>c.slug===selected);
const esc=str=>String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const content=document.getElementById('cruise-detail');
if(!cruise){
  document.title='Cruises in Vietnam | Lúa Travel';

}else{
 document.title=cruise.name+' | Cruises | Lúa Travel';
 const enquiry='contact.html?interest='+encodeURIComponent(cruise.name+' cruise booking');

 const card=c=>`<a href="cruise-detail.html?cruise=${encodeURIComponent(c.slug)}" class="lc-related-card"><img loading="lazy" src="${esc(c.image)}" alt="${esc(c.name)} cruise"><div><span>${esc(c.area)}</span><h3>${esc(c.name)}</h3></div></a>`;
 content.innerHTML=`
  <div class="lc-detail-wrap">

   <div class="lc-detail-title"><div><span class="lc-detail-eyebrow">${esc(cruise.area)} · ${esc(cruise.typeLabel)}</span><h1>${esc(cruise.name)}</h1><p>Explore the bay with Lúa Travel &amp; Tours.</p></div></div>
   <figure class="lc-detail-photo"><img src="${esc(cruise.image)}" alt="${esc(cruise.name)} cruise vessel" onerror="this.onerror=null;this.src=this.dataset.fallback" data-fallback="${esc(cruise.originalImage||'Ha%20Long%20Bay%20hero%20m%E1%BB%9Bi.jpg')}" ><figcaption>${esc(cruise.area)} · ${esc(cruise.typeLabel)}</figcaption></figure>
   ${cruise.gallery?.length>1?`<div class="lc-detail-gallery">${cruise.gallery.slice(1).map((photo,i)=>`<a href="${esc(photo)}" target="_blank" rel="noopener"><img src="${esc(photo)}" loading="lazy" alt="${esc(cruise.name)} — supplied photo ${i+2}"></a>`).join('')}</div>`:''}
   <div class="lc-detail-body">

     <div class="lc-detail-subsection"><h3>Planning your cruise</h3>
      <p>Our team can help you compare departure dates, room or cabin categories, travel arrangements and the most suitable route for your group. Please enquire for the operator’s latest itinerary and available packages.</p>
      <ul class="lc-detail-list"><li>Ask about cruise duration, departure port and transfers.</li><li>Confirm cabin category and occupancy for your party.</li><li>Review meals, activities and any special requests before booking.</li><li>Receive a personalised quotation based on your dates.</li></ul>
     </div>
    </div>
    <aside class="lc-detail-panel"><h2>At a glance</h2>
      <div class="lc-detail-fact"><span>Cruise</span><span>${esc(cruise.name)}</span></div>
      <div class="lc-detail-fact"><span>Cruising area</span><span>${esc(cruise.area)}</span></div>
      <div class="lc-detail-fact"><span>Experience</span><span>${esc(cruise.typeLabel)}</span></div>
      ${cruise.cabins?`<div class="lc-detail-fact"><span>Cabins (listed)</span><span>${esc(cruise.cabins)}</span></div>`:''}

      <a class="lc-detail-button" href="${enquiry}">REQUEST AVAILABILITY &amp; QUOTE ↗</a>

}
