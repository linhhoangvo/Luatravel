document.addEventListener('click',function(event){
 const button=event.target.closest('[data-itinerary-choice]');
 if(!button)return;
 const section=button.closest('.lc-itinerary-section');
 section.querySelectorAll('[data-itinerary-choice]').forEach(el=>{
  const active=el===button; el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active));
 });
 section.querySelectorAll('[data-itinerary-panel]').forEach(el=>{el.hidden=el.dataset.itineraryPanel!==button.dataset.itineraryChoice;});
});
